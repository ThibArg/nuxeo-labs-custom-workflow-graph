<!--
  Integration harness page (NOT packaged), driven by dev/tools/harness.mjs. Startup sequence copied from
  Web UI (index.js): polyfills, legacy globals, add-on bundles, then the lazy elements.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Custom Workflow Graph - integration harness</title>
    <style>
      html {
        --nuxeo-app-font: 'Inter', Arial, sans-serif;
        --nuxeo-text-default: #3a3a54;
        --nuxeo-page-background: #f5f5f5;
        --nuxeo-box: #fff;
        --nuxeo-primary-color: #0066ff;
        --nuxeo-border: rgba(0, 0, 0, 0.15);
      }
      html[data-theme='dark'] {
        --nuxeo-text-default: #fff;
        --nuxeo-page-background: #060826;
        --nuxeo-box: #2e2e3e;
        --nuxeo-primary-color: #1f28bf;
        --nuxeo-focus-ring-color: #4d9fff;
      }
      body {
        margin: 0;
        font-family: var(--nuxeo-app-font);
        background: var(--nuxeo-page-background);
        color: var(--nuxeo-text-default);
      }
    </style>
    <script src="/node_modules/@webcomponents/html-imports/html-imports.min.js"></script>
    <script>
      // What config.jsp and index.html define before Web UI starts
      window.Nuxeo = {
        UI: {
          config: {
            customWorkflowGraph: { enabled: 'true', layout: 'auto', direction: 'TB', allowLayoutSwitch: 'false' },
          },
        },
      };
    </script>
  </head>
  <body>
    <nuxeo-connection id="nx" url="/nuxeo"></nuxeo-connection>
    <div id="slot"></div>
    <script src="/out/harness.bundle.js"></script>
  </body>
</html>
