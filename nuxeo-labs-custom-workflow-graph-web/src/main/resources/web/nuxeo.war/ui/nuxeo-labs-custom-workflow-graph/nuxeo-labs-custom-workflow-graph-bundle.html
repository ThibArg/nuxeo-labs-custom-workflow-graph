<!--
  Entry point of the plugin, loaded by Web UI at startup (see OSGI-INF/cwg-webresources-contrib.xml).
  The scripts run in this order:

    common/    shared by every layout: core (settings, i18n, layout registry, model), geometry, icons,
               renderer, Polymer viewer and dialog, and the patch of Web UI's "View Graph"
    vendor/    dagre (MIT), used by the "auto" layout. Loaded right after cwg-core.js, which saves any
               global "dagre" defined by another add-on so cwg-layout-auto.js can restore it
    layouts/   one file per layout, registered with NuxeoLabs.CustomWorkflowGraph.registerLayout():
               "auto" (dagre) and "studio" (positions and paths drawn in Nuxeo Studio, falls back to "auto")

  To add a layout, add its script after cwg-layout-auto.js: nothing else changes, it can be selected with
  org.nuxeo.web.ui.customWorkflowGraph.layout and appears in the toolbar selector.
-->
<script src="common/cwg-core.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="common/cwg-geometry.js"></script>
<script src="common/cwg-icons.js"></script>
<script src="common/cwg-renderer-styles.js"></script>
<script src="common/cwg-renderer.js"></script>
<script src="layouts/cwg-layout-auto.js"></script>
<script src="layouts/cwg-layout-studio.js"></script>

<link rel="import" href="common/nuxeo-labs-custom-workflow-graph-viewer.html" />
<link rel="import" href="common/nuxeo-labs-custom-workflow-graph-dialog.html" />

<script src="common/cwg-override.js"></script>
